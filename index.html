<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knots</title>
<meta name="description" content="Say it once. Knots remembers — the personal memory that finds you at the right moment.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Karla:wght@400;500;600&display=swap">

<style>
  :root{
    --ground:#faf7f0;
    --surface:#edebe7;
    --ink:#1a1a1a;
    --ink-dim:#6b6660;
    --ink-faint:#d9d2c7;
    --accent:#ff3b2f;
    --accent-ink:#ffffff;
    --field-bg:rgba(26,26,26,0.04);
    --field-border:#d9d2c7;
    --thread:#b6ada0;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#1a1a1a;
      --surface:#242322;
      --ink:#faf7f0;
      --ink-dim:#a39b8f;
      --ink-faint:#4a4743;
      --field-bg:rgba(255,255,255,0.05);
      --field-border:rgba(255,255,255,0.13);
      --thread:#5c5850;
    }
  }
  :root[data-theme="dark"]{
    --ground:#1a1a1a;
    --surface:#242322;
    --ink:#faf7f0;
    --ink-dim:#a39b8f;
    --ink-faint:#4a4743;
    --field-bg:rgba(255,255,255,0.05);
    --field-border:rgba(255,255,255,0.13);
    --thread:#5c5850;
  }

  *{box-sizing:border-box;}
  html{color-scheme:light dark;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--ground);
    color:var(--ink);
    font-family:'Karla',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
  }
  ::selection{background:var(--accent);color:var(--accent-ink);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;}

  @media (prefers-reduced-motion: no-preference){
    .reveal{animation:rise 900ms cubic-bezier(.16,1,.3,1) both;}
    .reveal:nth-child(1){animation-delay:0ms;}
    .reveal:nth-child(2){animation-delay:110ms;}
    .reveal:nth-child(3){animation-delay:210ms;}
    .reveal:nth-child(4){animation-delay:300ms;}
  }
  @keyframes rise{ from{opacity:0;transform:translateY(14px);} to{opacity:1;transform:translateY(0);} }

  .wordmark{text-align:center;padding:44px 24px 0;}
  .wordmark .knot-mark{
    display:block;
    height:54px;
    width:auto;
    margin:0 auto 12px;
  }
  .wordmark span{
    font-family:'Bricolage Grotesque',sans-serif;
    font-weight:600;
    font-size:22px;
    letter-spacing:-0.01em;
    color:var(--ink);
  }

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:36px 24px 48px;
    max-width:680px;
    margin:0 auto;
  }
  @media (max-height:750px), (max-width:640px){
    main{ flex:none; justify-content:flex-start; padding-top:56px; }
  }

  /* ---- knot interaction ---- */
  .knot-stage{
    position:relative;
    width:120px;height:120px;
    margin:0 auto 8px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    background:none;border:none;padding:0;
  }
  .ripple{
    position:absolute;inset:0;border-radius:50%;
    border:1px solid var(--accent);
    opacity:0;
  }
  .knot-stage.tied .ripple{ animation:ripple 900ms ease-out; }
  @keyframes ripple{
    0%{opacity:.55;transform:scale(.5);}
    100%{opacity:0;transform:scale(1.9);}
  }
  .knot-stage svg{position:relative;z-index:1;overflow:visible;}
  .thread-path{
    fill:none;
    stroke:var(--thread);
    stroke-width:5;
    stroke-linecap:round;
    stroke-dasharray:150;
    stroke-dashoffset:0;
    transition:stroke 400ms ease;
  }
  .knot-stage.tied .thread-path{ stroke:var(--accent); }
  .loose{ transition:opacity 500ms ease; }
  .knot-img{
    position:absolute;
    top:50%;left:50%;
    width:46px;height:auto;
    transform:translate(-50%,-50%) scale(.7);
    opacity:0;
    transition:opacity 500ms ease 150ms, transform 500ms cubic-bezier(.34,1.56,.64,1) 150ms;
  }
  .knot-stage.tied .loose{ opacity:0; }
  .knot-stage.tied .knot-img{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  .knot-hint{
    font-size:11px;color:var(--ink-faint);letter-spacing:.08em;text-transform:uppercase;
    margin-top:2px;font-weight:600;
  }

  h1{
    font-family:'Bricolage Grotesque',sans-serif;
    font-size:clamp(44px,10vw,66px);
    font-weight:700;
    line-height:1.1;
    letter-spacing:-0.02em;
    margin:20px 0 0;
    text-wrap:balance;
  }
  h1 .accent-word{color:var(--accent);}

  .sub{
    margin:18px 0 0;
    font-size:clamp(17px,4vw,19px);
    color:var(--ink-dim);
    letter-spacing:.005em;
    max-width:440px;
  }

  form{display:flex;gap:10px;margin-top:36px;width:100%;max-width:400px;}
  input[type="email"]{
    flex:1;background:var(--field-bg);border:1px solid var(--field-border);
    border-radius:100px;padding:14px 20px;color:var(--ink);
    font-family:'Karla';font-size:16px;min-width:0;
  }
  input[type="email"]::placeholder{color:var(--ink-faint);}
  input[type="email"]:focus{outline:none;border-color:var(--accent);}
  button{
    font-family:'Karla';font-weight:600;font-size:15px;
    padding:14px 26px;border-radius:100px;border:none;
    background:var(--accent);color:var(--accent-ink);cursor:pointer;
    white-space:nowrap;transition:transform 120ms ease, opacity 120ms ease;
  }
  button:hover{opacity:.9;transform:translateY(-1px);}
  button:active{transform:translateY(0) scale(.97);}
  @media (max-width:460px){ form{flex-direction:column;} button{width:100%;} }

  .msg{margin-top:16px;font-size:13.5px;color:var(--ink-faint);min-height:18px;}
  .msg.ok{color:#5f8f5c;}
  .msg.err{color:#c1443a;}

  footer{padding:0 24px 40px;text-align:center;}
  .social{font-size:13px;color:var(--ink-faint);letter-spacing:.02em;}
  .fine{margin-top:14px;font-size:11.5px;color:var(--ink-faint);opacity:.75;}
</style>

    <h1 class="reveal">Say it once.<br>We'll <span class="accent-word">remember</span>.</h1>
    <p class="sub reveal">Knots turns a passing thought into the exact reminder you needed. Right when you needed it, not a folder you forgot to check.</p>

    <form id="wlForm" class="reveal">
      <input type="email" id="wlEmail" placeholder="you@email.com" required autocomplete="email" aria-label="Email address">
      <button type="submit">Tie up loose ends</button>
    </form>
    <p class="msg" id="wlMsg"></p>
  </main>

  <footer>
    <p class="social">@knotsapp.co</p>
    <p class="fine">We'll email you when Knots launches.</p>
  </footer>

<script>
  const stage = document.getElementById('knotStage');
  let tied = false;
  stage.addEventListener('click', () => {
    tied = !tied;
    stage.classList.remove('tied');
    void stage.offsetWidth;
    if (tied) stage.classList.add('tied');
    if (navigator.vibrate) navigator.vibrate(tied ? 10 : 6);
  });

  const wlForm = document.getElementById('wlForm');
  const wlMsg = document.getElementById('wlMsg');
  wlForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('wlEmail').value.trim();
    if (!email) return;
    wlMsg.textContent = 'Adding you…';
    wlMsg.className = 'msg';
    try {
      const res = await fetch('https://formspree.io/f/xnpqgaka', {
        method: 'POST',
        headers: { 'Accept': 'application/json' },
        body: (() => { const fd = new FormData(); fd.append('email', email); return fd; })()
      });
      if (!res.ok) throw new Error('bad response');
      wlMsg.textContent = "You're on the list.";
      wlMsg.className = 'msg ok';
      wlForm.reset();
    } catch (err) {
      wlMsg.textContent = "Couldn't reach the list right now — try again shortly.";
      wlMsg.className = 'msg err';
    }
  });
</script>
